<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INT Globe</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img class="club-logo" src="culture-club-logo.png" alt="INT Culture Club logo" />
    <div class="brand">
      <span class="logo">INT Globe</span>
      <span class="brand-subtitle">Culture Club stories</span>
    </div>
    <div class="view-controls" role="group" aria-label="Map display">
      <button id="map-mode" class="view-button active" aria-pressed="true">Map</button>
      <button id="globe-mode" class="view-button" aria-pressed="false">Globe</button>
      <button id="present-btn" class="view-button present-button" title="Show the spinning globe full-screen">Present</button>
    </div>
    <div class="name-area">
      <span class="name-label">Your name:</span>
      <input id="author-input" type="text" placeholder="Enter your name to add stories" maxlength="80" />
    </div>
  </header>

  <!-- Step 1: click map hint (shown instead of modal while placing) -->
  <div id="place-hint" class="hidden">
    &#128205; Click anywhere on the map to place your story &nbsp;&nbsp;
    <button id="hint-cancel">Cancel (Esc)</button>
  </div>

  <div id="map"></div>
  <div id="globe" class="hidden" aria-label="Interactive 3D globe"></div>
  <button id="fab" class="hidden" title="Add story">+</button>
  <button id="presentation-exit" class="hidden" title="Exit presentation (Esc)">Exit presentation</button>

  <!-- Step 2: fill in details (shown after map click) -->
  <div id="pin-modal" class="modal hidden">
    <div class="box">
      <h2>&#128205; Add a Story</h2>
      <p id="f-coords" class="coords-display"></p>
      <label>Title *
        <input id="f-title" type="text" maxlength="200" placeholder="A short title&#8230;" />
      </label>
      <label>Story
        <textarea id="f-story" rows="5" placeholder="Share your story&#8230;"></textarea>
      </label>
      <label>Country / Place
        <input id="f-country" type="text" placeholder="e.g. Kenya, Nairobi" />
      </label>
      <div class="actions">
        <button id="save-btn">Save Story</button>
        <button id="cancel-btn" class="ghost">Cancel</button>
      </div>
    </div>
  </div>

  <!-- View Pin Modal -->
  <div id="view-modal" class="modal hidden">
    <div class="box">
      <div class="view-top">
        <span id="v-badge" class="badge"></span>
        <button id="v-close">&#x2715;</button>
      </div>
      <h2 id="v-title"></h2>
      <p id="v-location" class="meta"></p>
      <p id="v-author"   class="meta"></p>
      <div id="v-story"></div>
      <div id="v-actions" class="actions"></div>
    </div>
  </div>

  <!-- Export / Import bar -->
  <div id="share-bar">
    <button id="export-btn" title="Export stories as JSON">&#8595; Export</button>
    <label id="import-label" title="Import stories from JSON">&#8593; Import<input id="import-input" type="file" accept=".json" /></label>
    <span id="pin-count"></span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
